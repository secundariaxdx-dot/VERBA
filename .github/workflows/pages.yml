name: Build web app (GitHub Pages)

# Rebuilds docs/ whenever the app's source changes and commits it, so
# GitHub Pages ("Deploy from a branch: main / root") always serves the latest version.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "index.html"
      - "404.html"
      - ".nojekyll"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build-pages.mjs
      - name: Commit the rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs index.html 404.html .nojekyll
          if git diff --cached --quiet; then
            echo "Site already up to date."
          else
            git commit -m "Rebuild web app"
            git pull --rebase --autostash
            git push
          fi
